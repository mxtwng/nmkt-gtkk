[platformio]
default_envs = nodemcu_32s
src_dir = firmware/src

; Settings shared by every board
[env]
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Adafruit BusIO needs SPI.h; "deep+" makes PlatformIO find it
lib_ldf_mode = deep+
lib_deps =
    adafruit/Adafruit SHT31 Library
    adafruit/Adafruit AHTX0
    paulstoffregen/OneWire
    milesburton/DallasTemperature
;upload_port = /dev/ttyUSB0
;monitor_port = /dev/ttyUSB0

; Fresh Ai-Thinker NodeMCU-32S (ESP32)
[env:nodemcu_32s]
platform = espressif32
board = nodemcu-32s

; ESP32 DevKitC V4 (WROOM-32D)
[env:esp32_devkitc_v4]
platform = espressif32
board = esp32dev

; ESP8266 NodeMCU, kept as a working fallback
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2