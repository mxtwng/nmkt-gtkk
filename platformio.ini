; Hai bo ESP32 da xac dinh. Cac GPIO van chua duoc gan.
[platformio]
default_envs = nodemcu_32s
src_dir = firmware/src

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    adafruit/Adafruit SHT31 Library
    adafruit/Adafruit AHTX0
    paulstoffregen/OneWire
    milesburton/DallasTemperature
[env:esp32_devkitc_v4]
; Dung cau hinh ESP32 Dev Module cho board DevKitC V4 mang chip WROOM-32D.
board = esp32dev

[env:nodemcu_32s]
board = nodemcu-32s